name: Merge to Main

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  checks:
    name: Merge to Main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Node
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Pull Cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-cache-${{ runner.os }}-x64-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install packages
        run: |
          pnpm install

      - name: Lint packages
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Test packages
        run: pnpm test:ts
